<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-image: url(D1.webp);
            background-size: cover;
        }
        .title-container {
            text-align: center;
            color: white;
            margin-top: 30px;
        }
        .title-container h1 {
            font-size: 28px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }
        .container {
            top: 50%;
            left: 50%;
            position: absolute;
            transform: translate(-50%, -50%);
        }
        .card {
            padding: 60px 40px 50px 40px;
            background: lightgray;
            border-radius: 20px;
            border: 1px solid black;
            text-align: center;
        }
        input[type="text"], input[type="password"] {
            border: none;
            background: transparent;
            border-bottom: 1px solid black;
            padding: 6px;
            margin-bottom: 15px;
            color: black;
            width: 100%;
        }
        #button {
            border-radius: 20px;
            padding: 10px 20px;
            background: dodgerblue;
            color: white;
            margin-top: 10px;
            border: none;
            outline: none;
            cursor: pointer;
            width: 100%;
        }
        a {
            font-size: 17px;
            display: block;
            margin-top: 10px;
        }
        .icon {
            width: 100px;
            height: 100px;
            margin-bottom: 40px;
        }
    </style>
</head>
<body>
    <div class="title-container">
        <h1>AI Driven Health Diagnostics System</h1>
    </div>
    <div class="container">
        <div class="card">
            <form action="/loginpost" method="POST">
                <img src="Employee icon.jpeg" alt="User Icon" class="icon">
                <input type="text" placeholder="Username (Email)" name="username" required><br>
                <input type="password" placeholder="Password" name="password" required><br>
                <a href="#">Forgot password?</a><br>
                <input type="submit" value="Login" id="button"><br>
                <a href="signup.html">Need an account? Sign Up</a>
            </form>
        </div>
    </div>
</body>
</html>
