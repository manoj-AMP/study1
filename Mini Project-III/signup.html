<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup Form</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-image: url(D1.webp);
            background-size: cover;
        }
        .title-container {
            text-align: center;
            color: white;
            margin-top: 10px;
        }
        .title-container h1 {
            font-size: 28px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
        .container {
            top: 50%;
            left: 50%;
            position: absolute;
            transform: translate(-50%, -50%);
        }
        .card {
            padding: 40px 60px;
            background: lightgray;
            border-radius: 20px;
            border-color: black;
            text-align: center;
        }
        input[type="text"], input[type="email"], input[type="password"] {
            border: none;
            background: transparent;
            border-bottom: 1px solid black;
            padding: 6px;
            margin-bottom: 15px;
            color: black;
            width: 100%;
        }
        #button {
            border-radius: 20px;
            padding: 10px 20px;
            background: dodgerblue;
            color: white;
            margin-top: 10px;
            border: none;
            outline: none;
            cursor: pointer;
            width: 100%;
        }
        a {
            font-size: 17px;
            display: block;
            margin-top: 10px;
            text-align: center;
        }
        .icon {
            width: 100px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="title-container">
        <h1>AI Driven Health Diagnostics System</h1>
    </div>
    <div class="container">
        <div class="card">
            <form action="/post" method="post">
                <img src="Employee icon.jpeg" alt="User Icon" class="icon">
                <h2>Sign Up</h2>
                <input type="text" placeholder="First Name" name="firstName" required><br>
                <input type="text" placeholder="Last Name" name="lastName" required><br>
                <input type="email" placeholder="Email" name="email" required><br>
                <input type="password" placeholder="Password" name="password" required><br>
                <input type="password" placeholder="Confirm Password" name="confirmPassword" required><br>
                <input type="submit" value="Sign Up" id="button"><br>
                <a href="login.html">Already have an account? Login</a>
            </form>
        </div>
    </div>
</body>
</html>
